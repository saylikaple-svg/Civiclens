[project]
name = "civiclens"
version = "1.0.0"
description = "Civiclens Monitoring Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "email-validator"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
